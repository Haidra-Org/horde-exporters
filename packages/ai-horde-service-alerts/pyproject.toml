[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-horde-service-alerts"
version = "0.5.0"
description = "Exposes AI Horde service alert signals as a FastAPI service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "cachetools>=5.5.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
ai-horde-service-alerts = "ai_horde_service_alerts.__main__:run"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.15.5",
    "zuban>=0.7.1",
    "types-cachetools>=5.5.0",
    "types-pyyaml>=6.0.12",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_horde_service_alerts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.zuban]
strict = true
files = ["src", "tests"]
exclude = [".venv"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "I",     # isort
  "E",     # pyflakes
  "W",     # pycodestyle warnings
  "F",     # flake8
  "UP",    # pyupgrade
  "YTT",   # flake8-2020
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "PIE",   # flake8-pie
  "RET",   # flake8-return
  "SIM",   # flake8-simplify
  "COM",   # flake8-commas
  "D",     # flake8-docstrings
  "D417",  # Missing argument descriptions in the docstring
  "ANN",   # flake8-annotations
  "RUF",   # ruff specific rules
  "ASYNC", # flake8-async
]
ignore = [
  "D105",   # Missing docstring in magic method
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "COM812", # Missing comma in list, handled automatically by `ruff format`
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "D215",   # Section underline is over-indented
  "D400",   # First line should end with a period
  "D404",   # First word of the docstring should not be This
  "D406",   # Section name should end with a newline
  "D407",   # Missing dashed underline after section
  "D408",   # Section underline should be in the line following the section's name
  "D409",   # Section underline should match the length of its name
  "D413",   # Missing blank line after last section
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "ANN"]
