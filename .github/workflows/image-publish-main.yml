# Build and publish rolling :main and :sha-<short> images on every push to
# main. Release tags are handled by release.yml; this workflow does not touch
# the release manifest or create GitHub Releases.

name: Image Publish (main)

on:
  push:
    branches:
      - main
    paths:
      - "packages/ai-horde-stats-exporter/**"
      - "packages/ai-horde-service-alerts/**"
      - ".github/workflows/image-publish-main.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ai-horde-stats-exporter
            image: ghcr.io/haidra-org/ai-horde-stats-exporter
          - package: ai-horde-service-alerts
            image: ghcr.io/haidra-org/ai-horde-service-alerts
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: packages/${{ matrix.package }}
          file: packages/${{ matrix.package }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
